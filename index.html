<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

         <nav>
             <a href="#">Catchup</a>
         </nav>

        <div id="planner">    
             <h1>Catchup</h1>
             <p>Plan your study time and stay on track 📚</p>
             <p>Not sure if you'll finish before the exam? Let CatchUp do the math! 😉</p>

             <div>
                <label>When's your exam?</label>
                <input id="examDate" type="datetime-local">
            </div>

            <div>
                <label>How many pages?</label>
                <input id="totalPages" type="number">
            </div>

            <div>
                <label>How many pages can you study per hour?</label>
                <input id="pagesPerHour" type="number">
            </div>

            <button id="btn">Can I Make It? 👀</button>
            <div id="result"></div>
        </div>
        <script src="script.js"></script>

    </body>
</html>
